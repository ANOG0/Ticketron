<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
        <title>GUUID Ticket Generator</title>
        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

            <script src="config.js" defer></script>
        <script src="js/main.js" defer></script>
        <link rel="stylesheet" href="main.css">
        <link rel="stylesheet" href="css/student.css">

        <link rel="stylesheet" href="notify/notify.css" />
        <script src="notify/notify.config.js"></script>
        <script src="notify/notify.js"></script>
    </head>
    <body class="background">
        <form id="form" class="wrapper">
            <h1>Signout</h1>
            <h2>Mockup</h2>

            <div class="active-ticket-panel" id="active-ticket-panel">
                <p class="active-label">You have an Active Ticket!</p>
                <p id="active-ticket-info"></p>
                <p id="active-ticket-status"></p>
                <button type="button" id="close-ticket-btn">Close Ticket</button>
            </div>

            <div class="input-prompt">
                <label for="name-input">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M656-179v-121h294v121H656Zm-80-241v-121h374v121H576Zm-80-241v-121h454v121H496ZM169-533.62q-42-42.62-42-103.5T169.06-740q42.06-42 102.94-42 60.88 0 103.44 42.06Q418-697.88 418-637q0 60.88-42.62 103.44Q332.76-491 271.88-491T169-533.62ZM9-179v-101.27Q9-309 22.2-333.73q13.19-24.73 37.87-39.34Q108-401 160.75-416 213.5-431 272-431t111.79 14.75Q437.08-401.5 485-373q24.11 14.09 37.55 39.14Q536-308.8 536-280.5V-179H9Z"/></svg>
                </label>
                <input class="form-input" type="text" name="name-input" id="name-input" placeholder="Full Name">
            </div>

            <div class="input-prompt">
                <label for="teacher-input">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M829-275v-266L480-351 25.5-599.5l454.5-247 455 247.07V-275H829ZM480-121 194-274.9v-179.6l286 155.82L766-454.5V-275L480-121Z"/></svg>
                </label>

                <input class="form-input" type="text" name="teacher-input" id="teacher-input" placeholder="Teacher Name">
            </div>

            <p>----------------------------------------</p>

            <div class="tag-wrapper">
                <ul id="tags"></ul>
            </div>

            <p id="error-messages"> </p>
            <button type="submit">Submit</button>

            <button type="button" id="signout-button" class="secondary-btn-inline">Sign Out</button>
        </form>
    </body>
</html>
